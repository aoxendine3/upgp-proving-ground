name: UPGP Proving Ground Verification Gate

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run WebAssembly & Document Sync Tests
        run: |
          python3 ops/scripts/test_upgp_wasm_module.py
          python3 ops/scripts/enforce_doc_sync_gate.py

      - name: Poincaré Geodesic Invariant Gate & Poison Replay Falsification
        run: |
          python3 ops/scripts/replay_poincare_poison_falsification.py

      - name: Sovereign 5-Trial Hardened Falsification Gauntlet
        run: |
          python3 ops/scripts/test_sovereign_hardened_falsification_gauntlet.py
